    <section class="ask-page">

  <img src="WhatsApp Image 2025-12-29 at 00.51.35_36855837.jpg" alt="Cute cat" class="ask-img">

  <h1 class="ask-title">
    Hey! I made something for you<br>
    <span>Will you see it? 💝</span>
  </h1>

  <div class="btn-group">
    <a href="index4.html" class="btn yes">YES</a>
    <a href="index3.html" class="btn no">NO</a>
  </div>

</section>

<style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
a {
  text-decoration: none;
  color: inherit;
}

.ask-page {
  min-height: 100vh;
  background: linear-gradient(180deg, #fff, #ffeef3);
  display: flex;
  flex-direction: column;
  align-items: center;
  /* justify-content: center; */
  margin-top: 50px;
  text-align: center;
  padding: 30px 20px;
  font-family: system-ui, sans-serif;
}

/* Image */
.ask-img {
  width: 120px;
  margin-bottom: 22px;
}

/* Title */
.ask-title {
  font-size: 1.4rem;
  font-weight: 600;
  line-height: 1.4;
  color: #222;
  margin-bottom: 28px;
}

.ask-title span {
  display: block;
  font-size: 0.95rem;
  font-weight: 400;
  color: #666;
  margin-top: 6px;
}

/* Buttons */
.btn-group {
  display: flex;
  gap: 18px;
}

.btn {
  padding: 12px 28px;
  font-size: 0.9rem;
  border-radius: 30px;
  background: transparent;
  border: 1.8px solid #222;
  cursor: pointer;
  transition: all 0.25s ease;
}

/* YES button */
.btn.yes:hover {
  background: #000000;
  color: #fff;
}

/* NO button (soft) */
/* .btn.no {
  border-color: #bbb;
  color: #777;
} */

.btn.no:hover {
  background: #000000;
  color: #fff;
}

/* Tap feedback */
.btn:active {
  transform: scale(0.95);
}

</style>

</body>
</html>
