<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You</title>
</head>
<body>
  <section class="voice-page">
    <img src="download.png" alt="">
  <h1>A Final message from me</h1>
  <p class="hint">to you❤️</p>
  <div class="audio-card">
    <audio controls>
      <source src="adio1.mpeg" type="audio/mpeg">
      Your browser does not support audio.
    </audio>
    <audio controls>
      <source src="WhatsApp Audio 2025-12-30 at 00.46.49_612e096d.dat.unknown" type="audio/mpeg">
      Your browser does not support audio.
    </audio>
  </div>
  <div class="end-line">— End —</div>
</section>
<style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
} img {
  width: 150px;
  transition: transform 0.25s ease, filter 0.25s ease;
  margin-bottom: 10px;
}
.voice-page {
  min-height: 100vh;
  background: linear-gradient(180deg, #fff, #ffeef3);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px 20px;
  font-family: system-ui, sans-serif;
}

/* Heading */
.voice-page h1 {
  font-size: 1.5rem;
  font-weight: 600;
  color: #222;
  margin-bottom: 6px;
}

/* Small hint text */
.hint {
  font-size: 0.85rem;
  color: #777;
  margin-bottom: 30px;
}

/* Audio card */
.audio-card {
  width: 100%;
  max-width: 320px;
  background: #ffffff;
  padding: 18px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  margin-bottom: 26px;
}

/* Audio player */
.audio-card audio {
  width: 100%;
}

/* Bottom line */
.end-line {
  font-size: 0.85rem;
  color: #888;
}

</style>
</body>
</html>
